<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Booking System - RxJS Edition</title>
    <link rel="stylesheet" href="styles.css">

    <script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
</head>
<body>
<div class="container">
    <header>
        <h1>🍽️ Restaurant Booking System</h1>
        <p>Reserve your table in seconds • Powered by RxJS</p>
    </header>

    <div class="booking-form-container">
        <h2>Make a Reservation</h2>
        <form id="bookingForm">
            <div class="form-group">
                <label for="restaurant">Restaurant</label>
                <select id="restaurant" name="restaurantId" required>
                    <option value="">Loading restaurants...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="guestName">Your Name</label>
                <input type="text" id="guestName" name="guestName"
                       placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="guestCount">Number of Guests</label>
                <input type="number" id="guestCount" name="guestCount"
                       min="1" max="20" value="2" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="bookingDate">Date</label>
                    <input type="date" id="bookingDate" name="bookingDate" required>
                </div>

                <div class="form-group">
                    <label for="bookingTime">Time</label>
                    <input type="time" id="bookingTime" name="bookingTime"
                           value="19:00" required>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                <span class="btn-text">Book Table</span>
                <span class="btn-loader" style="display: none;">⏳</span>
            </button>
        </form>
    </div>

    <div id="bookingResult" class="booking-result" style="display: none;">
        <div class="result-content">
            <div class="result-icon" id="resultIcon"></div>
            <h3 id="resultTitle"></h3>
            <p id="resultMessage"></p>
            <div class="booking-details" id="bookingDetails"></div>
        </div>
    </div>

    <div class="bookings-list-container">
        <div class="list-header">
            <h2>Recent Bookings</h2>
            <button class="btn-secondary" id="refreshBtn">🔄 Refresh</button>
        </div>
        <div id="bookingsList" class="bookings-list">
            <div class="loading">Loading bookings...</div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
